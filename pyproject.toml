[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "news-flywire-research"
version = "0.1.0"
description = "Reproducible Korean news-threat encoding and FlyWire circuit experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "networkx>=3.2,<4", "matplotlib>=3.8,<4", "PyYAML>=6,<7", "pyarrow>=15,<24", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
research = ["brian2>=2.7,<3", "joblib>=1.3,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
news-flywire = "news_flywire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
